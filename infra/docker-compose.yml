# self-hosted penpot + penpot mcp bridge, single vps, single internal network.
#
# reachability is handled by tailscale at the host level, not by this stack.
# services bind to 127.0.0.1 on the host so nothing is exposed publicly; the
# tailscale interface is what team members use to reach the box. see infra/README.md.
#
# topology:
#   penpot-frontend  -> ui, reverse-proxies to backend/exporter
#   penpot-backend   -> api
#   penpot-exporter  -> render/export service
#   penpot-postgres  -> penpot's database
#   penpot-redis     -> penpot's own cache/queue
#   penpot-mcp-server-> mcp bridge, single-user remote mode. built from source
#                       (infra/mcp/Dockerfile). serves the mcp server (4401 http),
#                       the websocket bridge (4402), AND the plugin web server
#                       (4400) that hands the plugin manifest to the browser.
#
# note: the designer still loads the plugin into their own browser, but the
# manifest it loads (http://<host>:4400/manifest.json) is served BY this stack,
# by the penpot-mcp-server container.

networks:
  penpot:
    driver: bridge

volumes:
  penpot_postgres_data:
  penpot_assets_data:

services:
  penpot-frontend:
    # pinned to match the mcp image tag. the mcp plugin warns on a version
    # mismatch between the mcp server and penpot, so frontend/backend/exporter
    # and the mcp image must all be the same version. see PENPOT_VERSION in .env.
    image: "penpotapp/frontend:${PENPOT_VERSION}"
    restart: always
    # host bind address. defaults to loopback (safe for local). on the vps, set
    # HOST_BIND to the tailnet IP (100.x) so the port is reachable over the
    # tailnet but not the public interface. see docker-compose.vps.yml.
    ports:
      - "${HOST_BIND:-127.0.0.1}:9001:8080"
    volumes:
      - penpot_assets_data:/opt/data/assets
    depends_on:
      - penpot-backend
      - penpot-exporter
    networks:
      - penpot
    environment:
      PENPOT_FLAGS: "$PENPOT_FLAGS"

  penpot-backend:
    image: "penpotapp/backend:${PENPOT_VERSION}"
    restart: always
    volumes:
      - penpot_assets_data:/opt/data/assets
    depends_on:
      - penpot-postgres
      - penpot-redis
    networks:
      - penpot
    environment:
      PENPOT_FLAGS: "$PENPOT_FLAGS"
      PENPOT_SECRET_KEY: "$PENPOT_SECRET_KEY"
      PENPOT_PUBLIC_URI: "$PENPOT_PUBLIC_URI"
      PENPOT_DATABASE_URI: "postgresql://penpot-postgres/penpot"
      PENPOT_DATABASE_USERNAME: "$PENPOT_DATABASE_USERNAME"
      PENPOT_DATABASE_PASSWORD: "$PENPOT_DATABASE_PASSWORD"
      PENPOT_REDIS_URI: "redis://penpot-redis/0"
      PENPOT_ASSETS_STORAGE_BACKEND: "assets-fs"
      PENPOT_STORAGE_ASSETS_FS_DIRECTORY: "/opt/data/assets"
      PENPOT_TELEMETRY_ENABLED: "false"

  penpot-exporter:
    image: "penpotapp/exporter:${PENPOT_VERSION}"
    restart: always
    networks:
      - penpot
    environment:
      # the exporter requires the same secret key as the backend, penpot 2.x
      # fails to boot without it (malli "missing-key" on :secret-key).
      PENPOT_SECRET_KEY: "$PENPOT_SECRET_KEY"
      PENPOT_PUBLIC_URI: "http://penpot-frontend:8080"
      PENPOT_REDIS_URI: "redis://penpot-redis/0"

  penpot-postgres:
    image: postgres:15
    restart: always
    stop_signal: SIGINT
    volumes:
      - penpot_postgres_data:/var/lib/postgresql/data
    networks:
      - penpot
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
      POSTGRES_DB: "penpot"
      POSTGRES_USER: "$PENPOT_DATABASE_USERNAME"
      POSTGRES_PASSWORD: "$PENPOT_DATABASE_PASSWORD"

  penpot-redis:
    image: redis:7
    restart: always
    networks:
      - penpot

  # the mcp bridge. this is the official penpot mcp server, packaged as a docker
  # built from source (infra/mcp/Dockerfile) rather than the community
  # sebathi/penpot-mcp-docker image. reason: the sebathi image only runs the mcp
  # server (4401) + websocket bridge (4402); it does NOT serve the browser plugin
  # on 4400. without the plugin server there is no manifest.json URL to load into
  # penpot's plugins dialog, so the bridge can never connect. building the
  # official penpot mcp workspace (penpot/penpot mcp/ at the matching tag) runs
  # BOTH the mcp server and the plugin server, which is what the pipeline needs.
  #
  # ports:
  #   4400 plugin web server (serves manifest.json to the browser)
  #   4401 mcp http/sse endpoint (ai client connects here)
  #   4402 websocket bridge (browser plugin connects here)
  #
  # runs single-user remote mode. multi-user remote is still "in progress"
  # upstream, so it's deliberately left off for the pilot -- see infra/README.md.
  #
  # bound to 127.0.0.1 on the host so nothing is exposed publicly; tailscale is
  # the access path. see infra/README.md.
  #
  # IMPORTANT (vps): the plugin bakes the websocket URL at BUILD time from
  # PENPOT_MCP_SERVER_ADDRESS. building on localhost hard-codes ws://localhost:4402
  # into the plugin, which a remote browser cannot reach. for the vps, rebuild the
  # image with PENPOT_MCP_SERVER_ADDRESS set to the tailnet hostname (passed as a
  # build arg), don't just set it at runtime. see infra/README.md.
  penpot-mcp-server:
    build:
      context: ./mcp
      args:
        # a real penpot/penpot git TAG (not an "mcp-prod-*" branch -- those don't
        # exist). keep in lockstep with the penpotapp/* tags via PENPOT_VERSION.
        PENPOT_TAG: "${PENPOT_VERSION}"
        # websocket URL baked into the plugin at build time. the plugin reads
        # WS_URI (NOT PENPOT_MCP_SERVER_ADDRESS). must be reachable from the
        # designer's browser. defaults to localhost via ${..:-} for local builds;
        # the vps deploy sets PENPOT_MCP_SERVER_ADDRESS so this becomes the tailnet
        # host. rebuild required if the host changes.
        WS_URI: "http://${PENPOT_MCP_SERVER_ADDRESS:-localhost}:4402"
    image: "design-ai/penpot-mcp:${PENPOT_VERSION}"
    restart: always
    # HOST_BIND defaults to loopback for local; the vps overlay sets it to the
    # tailnet IP so these are reachable over the tailnet only.
    ports:
      - "${HOST_BIND:-127.0.0.1}:4400:4400"
      - "${HOST_BIND:-127.0.0.1}:4401:4401"
      - "${HOST_BIND:-127.0.0.1}:4402:4402"
    depends_on:
      - penpot-frontend
    networks:
      - penpot
    environment:
      # remote, single-user. remote mode disables server-side filesystem access.
      PENPOT_MCP_REMOTE_MODE: "true"
      # bind inside the container so the 127.0.0.1 host port mappings can reach
      # the servers. public exposure is prevented by the host binding above.
      PENPOT_MCP_SERVER_LISTEN_ADDRESS: "0.0.0.0"
      PENPOT_MCP_PLUGIN_SERVER_LISTEN_ADDRESS: "0.0.0.0"
      # hostname baked into the plugin's ws:// url so the browser can reach the
      # bridge. localhost locally; the tailnet hostname on the vps (and remember
      # the build-time caveat above).
      PENPOT_MCP_SERVER_ADDRESS: "${PENPOT_MCP_SERVER_ADDRESS}"
      PENPOT_MCP_SERVER_PORT: "4401"
      PENPOT_MCP_WEBSOCKET_PORT: "4402"
      PENPOT_MCP_LOG_LEVEL: "info"
      # the plugin server (4400) otherwise rejects any Host not in its allowlist
      # with a 403. upstream hardcodes `allowedHosts: []`; our Dockerfile patches
      # the vite config to read this env var (comma-separated) at runtime. set it
      # to the tailnet host on the vps; empty locally (localhost allowed by default).
      # runtime-only: change + restart, no rebuild.
      PENPOT_MCP_PLUGIN_ALLOWED_HOSTS: "${PENPOT_MCP_SERVER_ADDRESS}"
